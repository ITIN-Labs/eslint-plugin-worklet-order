# Runs the tests against the newest dependency versions the ranges allow and the newest Node, so
# breakage shows up here before users report it. It never blocks pull requests.
name: Weekly

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: true

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
      - run: rm package-lock.json && npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm run check:package
      # Compares the rule with the newest worklets Babel plugin. The plugin's peer dependencies
      # include react-native, so it's installed here without them, never as a dev dependency.
      - run: npm install --no-save --ignore-scripts --legacy-peer-deps react-native-worklets@latest @babel/core@7 @babel/preset-typescript@7
      - run: node --test test/differential.test.ts
        env:
          DIFFERENTIAL: required
